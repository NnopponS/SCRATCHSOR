<text x="90" y="778" font-family="Arial,sans-serif" font-size="28" fill="#172b45" font-weight="bold">POWER NETS</text>
<text x="90" y="824" font-family="Arial,sans-serif" font-size="24" fill="#c53030">Every red 3V3 label is the same</text>
<text x="90" y="861" font-family="Arial,sans-serif" font-size="24" fill="#c53030">ESP32 3.3 V supply.</text>
<text x="90" y="919" font-family="Arial,sans-serif" font-size="24" fill="#3b4553">Every GND label is connected</text>
<text x="90" y="956" font-family="Arial,sans-serif" font-size="24" fill="#3b4553">to ESP32 GND.</text>
<text x="90" y="1015" font-family="Arial,sans-serif" font-size="25" fill="#172b45" font-weight="bold">3V3 and GND stay separate.</text>
<text x="90" y="1078" font-family="Arial,sans-serif" font-size="23" fill="#172b45">ESP32 VIN / 5V: unconnected.</text>
<text x="90" y="1118" font-family="Arial,sans-serif" font-size="23" fill="#172b45">Sensor INT / TRIG / MISO:</text>
<text x="90" y="1153" font-family="Arial,sans-serif" font-size="23" fill="#172b45">unconnected if present.</text>
<line x1="70" y1="1330" x2="2030" y2="1330" stroke="#cad3df" stroke-width="2" />
<text x="80" y="1384" font-family="Arial,sans-serif" font-size="24" fill="#172b45">1. Disconnect USB before wiring. Power mux, sensors and OLED from 3.3 V; use one common ground.</text>
<text x="80" y="1427" font-family="Arial,sans-serif" font-size="24" fill="#172b45">2. SDn goes to SDA and SCn goes to SCL on the SAME device. Never join SDA and SCL together.</text>
<text x="80" y="1470" font-family="Arial,sans-serif" font-size="24" fill="#172b45">3. I2C needs pull-ups to 3.3 V on the main bus and each populated channel; check those already fitted on modules.</text>
<text x="80" y="1513" font-family="Arial,sans-serif" font-size="24" fill="#172b45">4. RESET is active-low; shown tied high for normal operation. Add local decoupling if building a bare-chip circuit.</text>
<text x="80" y="1556" font-family="Arial,sans-serif" font-size="24" fill="#172b45">5. OLED is on CHANNEL 0. Sensors use CHANNELS 2-5. Pin order varies by module: use the actual board labels.</text>
<text x="80" y="1597" font-family="Arial,sans-serif" font-size="22" fill="#172b45">Source: include/pins.h + include/config.h; sensor_service.cpp + oled_manager.cpp. Bus: 100 kHz.</text>
</svg>