; SCRATCHSOR — ESP32 wireless magnetic sensing system
; Build:   pio run
; Upload:  pio run -t upload -e esp32dev
; FS:      pio run -t buildfs -e esp32dev && pio run -t uploadfs -e esp32dev
; Monitor: pio device monitor -b 115200
; Tests:   pio test -e native

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino
monitor_speed = 921600
upload_port = COM7
monitor_port = COM7
; DTR/RTS automatic reset was verified on this board over COM7.
; No enclosure access or BOOT/EN button presses are normally needed.
upload_flags = --before=default_reset
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -DSCRATCHSOR_BUILD=1
lib_deps =
    olikraus/U8G2@^2.35.19
    bblanchon/ArduinoJson@^7.3.1
    links2004/WebSockets@^2.6.1

[env:native]
; Host-side unit tests for pure C++ modules (signal processing,
; calibration math, protocol helpers). No Arduino dependency.
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Iinclude
    -DSCRATCHSOR_NATIVE_TEST=1
test_filter = test_*

; Standalone boot/I2C diagnostic. No NVS, filesystem or Wi-Fi startup.
; Upload: pio run -e board_bringup -t upload --upload-port COM7
; Restore application: pio run -e esp32dev -t upload --upload-port COM7
[env:board_bringup]
extends = env:esp32dev
monitor_speed = 115200
lib_deps =
build_flags =
    -std=gnu++17
    -DSCRATCHSOR_BOARD_BRINGUP=1
build_src_filter = -<*> +<diagnostics/board_bringup.cpp>
